[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dream-job-engine"
version = "0.1.0"
description = "Local-first, evidence-backed AI job decision engine"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pydantic>=2.12,<3",
    "openai>=3.24,<4",
    "httpx>=0.28,<1",
    "mcp[cli]>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.2,<2",
    "setuptools>=75",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_dream_job_engine = ["templates/*.json"]
